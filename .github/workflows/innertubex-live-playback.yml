name: InnerTubeX live playback probe
on: push
jobs:
  live:
    if: contains(github.event.head_commit.message, '[modern-live]')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      - name: Ensure Android compile SDK 37
        run: .github/scripts/install-compile-sdk.sh
      - name: Install verified Gradle 9.3.1
        run: .github/scripts/install-gradle-ci.sh
      - name: Build debug APK
        run: .github/scripts/gradle-ci.sh :app:assembleDebug
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run live InnerTubeX player on API 29
        env:
          VIMUSIC_EMULATOR_API: 29
          VIMUSIC_MODERN_LIVE_PROBE: 1
        run: |
          export VIMUSIC_GRADLE_JAVA_HOME="$JAVA_HOME_21_X64"
          .github/scripts/run-emulator-tests.sh
      - name: Report sanitized live status
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'vimusic-live-probe.log'
          if path.exists():
              lines = [line for line in path.read_text(errors='replace').splitlines() if re.fullmatch(r'(?:LIVE_(?:RESOLVED|RESOLVE_FAILED|PROBE|KEY|MATRIX|TOKEN|DIRECT|WATCH|BOOTSTRAP)|STREAM_(?:HTTP|SELECTED|REQUEST)|BOTGUARD) [A-Za-z0-9_=,:. -]{1,700}', line)]
              if lines:
                  # GitHub truncates an individual annotation at 4096 characters.
                  chunk = []
                  length = 0
                  for line in lines[-160:]:
                      if length + len(line) + 3 > 3000:
                          print('::notice title=Live InnerTubeX probe::' + '%0A'.join(chunk))
                          chunk, length = [], 0
                      chunk.append(line)
                      length += len(line) + 3
                  if chunk:
                      print('::notice title=Live InnerTubeX probe::' + '%0A'.join(chunk))
          PY
