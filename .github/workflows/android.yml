name: Android CI

on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle
      - name: Build debug APK
        run: .github/scripts/gradle-ci.sh :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vimusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Run JVM tests and compile instrumentation APK
        run: .github/scripts/gradle-ci.sh :innertube:test :kugou:test :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: vimusic-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  instrumentation:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle
      - name: Set up JDK 17 for Android command-line tools
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run playback instrumentation tests
        run: |
          set +e
          .github/scripts/run-emulator-tests.sh > "$RUNNER_TEMP/emulator-tests.log" 2>&1
          result=$?
          tail -n 120 "$RUNNER_TEMP/emulator-tests.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/emulator-tests.log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          excerpt = "\n".join(lines[-80:])
          for report in pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              excerpt += "\n" + report.read_text(errors="replace")[-12000:]
          text = excerpt[-20000:]
          print("::error title=Emulator validation failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          fi
          exit "$result"
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vimusic-android-test-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
