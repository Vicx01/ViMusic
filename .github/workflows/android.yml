name: Android CI

on: push

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle
      - name: Install verified Gradle 7.4
        run: .github/scripts/install-gradle-ci.sh
      - name: Share verified Gradle distribution with emulator job
        uses: actions/upload-artifact@v4
        with:
          name: gradle-7.4-ci
          path: ${{ runner.temp }}/gradle-7.4-bin.zip
          retention-days: 1
          if-no-files-found: error
      - name: Build debug APK
        run: .github/scripts/gradle-ci.sh :app:assembleDebug
      - name: Record debug APK SHA-256
        run: echo "::notice title=Debug APK SHA-256::$(sha256sum app/build/outputs/apk/debug/app-debug.apk | cut -d' ' -f1)"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vimusic-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Run JVM tests and compile instrumentation APK
        run: .github/scripts/gradle-ci.sh :innertube:test :kugou:test :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Verify resolver JVM tests
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path("innertube/build/test-results/test").glob("TEST-*.xml"))
          cases = [case for path in reports for case in ET.parse(path).getroot().iter("testcase")]
          required = {"eachRequestPhasePreservesKtorCauseAndReportsOnlySafeMetadata", "unknownBodiesAndUntrustedFieldsAreNotExposed", "networkIoFailureIsNotSwallowedOrReclassified", "productionPlayerRequestHasAuditedIdentityBodyAndHeaders"}
          executed = {case.get("name") for case in cases if case.find("skipped") is None}
          failed = [case.get("name") for case in cases if case.find("failure") is not None or case.find("error") is not None]
          missing = required - executed
          print(f"::notice title=Resolver JVM tests::Executed {len(executed)} distinct tests; failures {len(failed)}; missing {len(missing)}.")
          if missing or failed:
              raise SystemExit(f"Missing: {sorted(missing)}; failed: {failed}")
          PY
      - name: Upload instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: vimusic-android-test-apk
          path: app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  instrumentation:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle
      - name: Download verified Gradle distribution
        uses: actions/download-artifact@v4
        with:
          name: gradle-7.4-ci
          path: ${{ runner.temp }}
      - name: Verify and unpack Gradle distribution
        run: |
          echo "8cc27038d5dbd815759851ba53e70cf62e481b87494cc97cfd97982ada5ba634  $RUNNER_TEMP/gradle-7.4-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-7.4-bin.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_EXECUTABLE=$RUNNER_TEMP/gradle-7.4/bin/gradle" >> "$GITHUB_ENV"
      - name: Set up JDK 17 for Android command-line tools
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run playback instrumentation tests
        run: |
          set +e
          .github/scripts/run-emulator-tests.sh > "$RUNNER_TEMP/emulator-tests.log" 2>&1
          result=$?
          tail -n 120 "$RUNNER_TEMP/emulator-tests.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/emulator-tests.log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          excerpt = "\n".join(lines[-80:])
          for report in pathlib.Path("app/build/outputs/androidTest-results").rglob("*.xml"):
              excerpt += "\n" + report.read_text(errors="replace")[-12000:]
          text = excerpt[-3000:]
          print("::error title=Emulator validation failed::" + text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
          fi
          exit "$result"
      - name: Verify instrumentation test report
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          reports = list(pathlib.Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          cases = []
          for path in reports:
              cases.extend(ET.parse(path).getroot().iter("testcase"))
          required = {
              "resolutionPreservesUnboundedAndBoundedRequestsOnMissAndRingHit",
              "errorDetailsIncludeHttpStatusAndCauseWithoutSignedUrls",
              "resolverHttpErrorIsSanitizedAndNotRetried",
              "loaderWrapsNonIoAndForwardsResolverIo",
              "httpRangesAndResponseHeadersFollowTheRequestedDataSpec",
              "continuousPlaybackPassesFirst512KiBAndThirtySeconds",
          }
          executed = {case.get("name") for case in cases if case.find("skipped") is None}
          failed = [case.get("name") for case in cases if case.find("failure") is not None or case.find("error") is not None]
          missing = required - executed
          print(f"::notice title=Playback instrumentation results::Executed {len(executed)} distinct tests; failures {len(failed)}; missing {len(missing)}.")
          if missing or failed:
              raise SystemExit(f"Missing: {sorted(missing)}; failed: {failed}")
          PY
      - name: Upload Android test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vimusic-android-test-results
          path: app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  probe:
    runs-on: ubuntu-24.04
    needs: build
    if: contains(github.event.head_commit.message, '[player-probe]')
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "11"
          distribution: temurin
          cache: gradle
      - name: Download verified Gradle distribution
        uses: actions/download-artifact@v4
        with:
          name: gradle-7.4-ci
          path: ${{ runner.temp }}
      - name: Verify and unpack Gradle distribution
        run: |
          echo "8cc27038d5dbd815759851ba53e70cf62e481b87494cc97cfd97982ada5ba634  $RUNNER_TEMP/gradle-7.4-bin.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/gradle-7.4-bin.zip" -d "$RUNNER_TEMP"
          echo "GRADLE_EXECUTABLE=$RUNNER_TEMP/gradle-7.4/bin/gradle" >> "$GITHUB_ENV"
      - name: Probe one public fixture with controlled request profiles
        env:
          VIMUSIC_LIVE_PLAYER_PROBE: "1"
        run: .github/scripts/gradle-ci.sh :innertube:test --tests '*LivePlayerProbeTest.controlledPlayerRequests'
      - name: Publish sanitized results
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          reports = list(pathlib.Path('innertube/build/test-results/test').glob('*LivePlayerProbeTest*.xml'))
          if len(reports) != 1:
              raise SystemExit('Live probe report missing')
          root = ET.parse(reports[0]).getroot()
          lines = (root.findtext('system-out') or '').splitlines()
          cases = [line for line in lines if re.fullmatch(r'PROBE\|[a-z_]+\|http=(?:[0-9]{3}|none)\|[A-Za-z0-9_=, |()-]+', line)]
          if len(cases) != 13:
              raise SystemExit('Expected thirteen sanitized probe result lines')
          # GitHub limits individual notice annotations; emit the whole safe table once.
          summary = '\n'.join(cases).replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=InnerTube probe::' + summary)
          PY
